command:
  - uvicorn
  - src.app:app
  - --host
  - "0.0.0.0"
  - --workers
  - "2"

env:
  # Lakebase (autoscaling Postgres) connection — the app reads these at runtime.
  # app.yaml can't reference bundle ${resources}, so keep LAKEBASE_PROJECT_ID /
  # LAKEBASE_BRANCH in sync with databricks.yml.
  - name: 'LAKEBASE_PROJECT_ID'
    value: 'lakebase-fastapi-app-db'
  - name: 'LAKEBASE_BRANCH'
    value: 'production'
  - name: 'LAKEBASE_ENDPOINT'
    value: 'primary'
  - name: 'LAKEBASE_DATABASE_NAME'
    value: 'databricks_postgres'
  - name: 'DATABRICKS_DATABASE_PORT'
    value: '5432'

  # Connection pool tuning
  - name: 'DB_POOL_SIZE'
    value: '5'
  - name: 'DB_MAX_OVERFLOW'
    value: '10'
  - name: 'DB_COMMAND_TIMEOUT'
    value: '30'
  - name: 'DB_POOL_TIMEOUT'
    value: '10'
  - name: 'DB_POOL_RECYCLE_INTERVAL'
    value: '2700'

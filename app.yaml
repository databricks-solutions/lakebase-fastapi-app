command:
  - uvicorn
  - src.app:app
  - --host
  - "0.0.0.0"
  - --workers
  - "2"
  
env:
  # Lakebase (autoscaling Postgres) — values match the resources the bundle creates
  # (databricks.yml) / the Swagger route. app.yaml can't reference bundle ${resources},
  # so keep these literals in sync with databricks.yml if you change project/catalog.
  - name: 'LAKEBASE_PROJECT_ID'
    value: 'lakebase-fastapi-app-db'
  - name: 'LAKEBASE_BRANCH'
    value: 'production'
  - name: 'LAKEBASE_DATABASE_NAME'
    value: 'databricks_postgres'
  - name: 'LAKEBASE_CATALOG_NAME'
    value: 'lakebase-fastapi-app-catalog'

  # Synced table pipeline checkpoint storage (set to a catalog.schema you can write to)
  - name: 'SYNCED_TABLE_STORAGE_CATALOG'
    value: 'your_storage_catalog'
  - name: 'SYNCED_TABLE_STORAGE_SCHEMA'
    value: 'your_storage_schema'

  - name: 'DATABRICKS_DATABASE_PORT'
    value: '5432'

  - name: 'DEFAULT_POSTGRES_SCHEMA'
    value: 'public'
  - name: 'DEFAULT_POSTGRES_TABLE'
    value: 'orders_synced'

  - name: 'DB_POOL_SIZE'
    value: '5'
  - name: 'DB_MAX_OVERFLOW'
    value: '10'
  - name: 'DB_COMMAND_TIMEOUT'
    value: '30'
  - name: 'DB_POOL_TIMEOUT'
    value: '10'
  - name: 'DB_POOL_RECYCLE_INTERVAL'
    value: '3600'
